<main class="dashboard">
  <header>
    <a class="brand" href="/app/dashboard" aria-label="LockerGo inicio">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span>Locker<span class="brand-accent">Go</span></span>
    </a>
    <button type="button" (click)="logout()" [disabled]="signingOut()">Cerrar sesión</button>
  </header>

  <section>
    <p class="eyebrow">ESPACIO PERSONAL</p>
    <h1>Hola, {{ auth.user()?.name }}.</h1>
    <p>Tu sesión está activa como {{ auth.user()?.role }}.</p>
    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
  </section>
</main>
