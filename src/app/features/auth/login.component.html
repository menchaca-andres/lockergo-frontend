<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand">
      <span class="brand-orbit" aria-hidden="true">
        @for (dot of logoDots; track dot) {
          <span class="logo-dot" [style.--dot-angle]="dot % 28 * (360 / 28) + (dot >= 56 ? 6.4 : dot >= 28 ? 3.2 : 0) + 'deg'" [style.--dot-radius]="dot < 28 ? '-58px' : dot < 56 ? '-69px' : '-80px'" [style.--dot-size]="dot < 28 ? '4px' : dot < 56 ? '5px' : '6px'"></span>
        }
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M7 13.5 16 8l9 5.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 23.5v-10Z" />
            <path d="M12 15h8v10h-8zM14.5 18h3" />
          </svg>
        </span>
      </span>
      <span class="brand-name">Locker<span>Go</span></span>
    </div>

    <h1 id="login-title">Iniciar sesión</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="credentials-group" [class.credentials-invalid]="credentialsInvalid()">
        <div class="field email-field">
          <div class="input-control">
            <input id="email" type="email" formControlName="email" autocomplete="username" inputmode="email" placeholder=" " (input)="clearCredentialError()" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"/>
            <label for="email">Correo electrónico</label>
          </div>
        </div>

        <div class="field password-field">
          <div class="input-control">
            <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder=" " (input)="clearCredentialError()" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"/>
            <label for="password">Contraseña</label>
          </div>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="form-error" role="alert">
          <span aria-hidden="true">ⓘ</span>
          <span>{{ errorMessage() }}</span>
        </p>
      }

      <button class="continue-button" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Verificando...</span>
        } @else {
          <span>Iniciar sesión</span>
        }
      </button>
    </form>
  </section>

  <footer class="login-footer">
    <nav class="footer-links" aria-label="Información de LockerGo">
      <span>Estado del sistema</span>
      <span>Privacidad</span>
      <span>Términos y condiciones</span>
    </nav>
    <span class="copyright">Copyright © 2026 LockerGo. Todos los derechos reservados.</span>
  </footer>
</main>
